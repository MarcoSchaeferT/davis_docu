<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum - Visualization Group</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>

<body>
  <h1>Impressum</h1>
  <div id="map"></div>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="{{ site.baseurl }}/assets/js/dataLoader.js"></script>
  <script src="{{ site.baseurl }}/assets/js/drawMap.js"></script>
  <script src="{{ site.baseurl }}/assets/js/drawLayer.js"></script>
  <script>

    let mapSettings = {
      center: [20, 0],
      zoom: 2,
      isDraging: true,
      isZooming: true,
      isOpenStreetMap: true
    };

    const dataPath = "{{ site.baseurl }}/assets/data/countries.csv";
    const geoJSON_URL = "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json";

    let countryData = dataLoader(dataPath);
    let mapObj = drawMap(mapSettings);
    drawLayer(geoJSON_URL, countryData, mapObj);

  </script>
</body>

</html>
